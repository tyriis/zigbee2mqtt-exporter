---
fail_fast: false
default_stages:
  - commit
  - push

repos:
  # Local hooks instead of tyriis/pre-commit-npm, which is hard-wired to npm,
  # and instead of mirrors-prettier, whose pinned prettier drifts from the one
  # in package.json and reformats files the repo's own prettier disagrees with.
  - repo: local
    hooks:
      - id: prettier
        name: pnpm exec prettier
        entry: pnpm exec prettier --write
        language: system
        types_or:
          - javascript
          - jsx
          - ts
          - tsx
          - json
          - yaml
          - markdown
          - css
      - id: lint
        name: pnpm lint
        entry: pnpm run lint
        language: system
        files: \.ts$
        pass_filenames: false
      - id: test
        name: pnpm test
        entry: pnpm test
        language: system
        files: \.ts$
        pass_filenames: false
  - repo: https://github.com/thlorenz/doctoc
    rev: v2.5.0
    hooks:
      - id: doctoc
        args:
          - --update-only
          - --maxlevel
          - "3"
          - --github
          - --notitle

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args:
          - --maxkb=250
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-symlinks
      - id: check-xml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args:
          - --fix=auto
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - --config-file
          - .yamllint.yaml

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: remove-crlf
      - id: remove-tabs

  - repo: https://github.com/sirosen/texthooks
    rev: 1.0.0
    hooks:
      - id: fix-smartquotes
      - id: fix-ligatures
      - id: forbid-bidi-controls

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint-fix
        args:
          - --config
          - .markdownlint.yaml
