---
name: Publish Docker image

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Never publish from a red tree: the reusable workflow must pass first.
  ci:
    uses: ./.github/workflows/ci.yaml

  build:
    name: Build, push and sign
    needs: ci
    runs-on: ubuntu-latest

    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # Workaround: https://github.com/docker/build-push-action/issues/461
      # https://github.com/marketplace/actions/docker-setup-qemu
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4.4.0

      # https://github.com/marketplace/actions/docker-setup-buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # https://github.com/marketplace/actions/docker-login
      - name: Setup GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Defaults already give semver tags (1.2.3, 1.2, 1) plus `latest` for
      # a non-prerelease `v*.*.*` tag, and nothing but the prerelease tag for
      # `v*.*.*-*`. No extra rules needed.
      # https://github.com/marketplace/actions/docker-metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # https://github.com/marketplace/actions/build-and-push-docker-images
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=buildkit
          cache-to: type=gha,mode=max,scope=buildkit
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # cosign v3 keyless: no COSIGN_EXPERIMENTAL, but `--yes` is mandatory
      # because the privacy-statement prompt cannot be answered on a runner.
      # The installer's own default is v3.0.6, hence the explicit release.
      # https://github.com/marketplace/actions/cosign-installer
      - name: Setup cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.4

      # Sign by digest, never by tag: a tag can be moved after the fact.
      # The signature goes into the registry, next to the image it covers.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Proves the signature is attached and discoverable by anyone pulling
      # the image, not just that the signing command exited 0.
      - name: Verify the image signature
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/tyriis/zigbee2mqtt-exporter/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
